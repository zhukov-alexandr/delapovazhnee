name: Deploy

# Деплой по тэгу v* (v1.0.0, v0.3, v2, ...): тесты -> сборка образа в GHCR -> сервер тянет и поднимает.
# Секреты: VDS_HOST, VDS_USER, VDS_PATH, VDS_SSH_KEY (+ опц. VDS_SSH_PORT), GHCR_PAT (read:packages).
on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install -r requirements-dev.txt
      - name: pytest
        run: python -m pytest -q
      - name: node game-logic self-tests
        run: |
          node tests/js/selftest.node.mjs
          node tests/js/gamestate.smoke.mjs
          node tests/js/sprites.smoke.mjs
          node tests/js/collectibles.smoke.mjs
          node tests/js/prefs.smoke.mjs

  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.img.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name (lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.ref_name }}
            ${{ steps.img.outputs.name }}:latest

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VDS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Ship compose + Caddyfile, then pull & up on VDS
        env:
          IMAGE: ${{ needs.build-push.outputs.image }}:${{ github.ref_name }}
          GHCR_OWNER: ${{ github.repository_owner }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}
          VDS_PATH: ${{ secrets.VDS_PATH }}
          VDS_SSH_PORT: ${{ secrets.VDS_SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${VDS_SSH_PORT:-22}"
          COMMON="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
          # Порт: scp хочет -P (заглавную), ssh — -p (строчную). Не путать!
          # Кладём compose-файл и Caddyfile рядом (сервер не хранит git-репозиторий).
          scp $COMMON -P "$PORT" docker-compose.yml "$VDS_USER@$VDS_HOST:$VDS_PATH/docker-compose.yml"
          scp $COMMON -P "$PORT" deploy/Caddyfile   "$VDS_USER@$VDS_HOST:$VDS_PATH/Caddyfile"
          # На сервере: логин в GHCR (приватный образ), тянем нужный тег, поднимаем, чистим старьё.
          ssh $COMMON -p "$PORT" "$VDS_USER@$VDS_HOST" "\
            cd '$VDS_PATH' && \
            echo '$GHCR_PAT' | docker login ghcr.io -u '$GHCR_OWNER' --password-stdin && \
            export IMAGE='$IMAGE' && \
            docker compose pull && \
            docker compose up -d && \
            docker image prune -f"
