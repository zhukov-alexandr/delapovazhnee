# Прод-стек: app (uvicorn) + Caddy (reverse proxy / позже авто-HTTPS).
# Запускается на VDS: `IMAGE=ghcr.io/<owner>/<repo>:<tag> docker compose up -d`
# (тег подставляет деплой-воркфлоу; см. .github/workflows/deploy.yml и deploy/DEPLOY.md).
services:
  app:
    image: ${IMAGE:?set IMAGE, e.g. ghcr.io/owner/repo:v1.0.0}
    restart: unless-stopped
    env_file:
      - .env                       # секреты приложения (PRESAVE_URL, ADMIN_*, SECRET_KEY, ...)
    volumes:
      - dbdata:/app/db             # sqlite переживает пересоздание контейнера
      # Музыка кладётся на VDS и монтируется read-only (не пекётся в образ).
      # (items и характеры/спрайты персонажей запекаются в образ — см. .dockerignore.)
      - ./static/assets:/app/static/assets:ro
    expose:
      - "8000"                     # только внутри docker-сети; наружу — через Caddy

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      # Пусто → HTTP на :80 (по IP). Задай SITE_ADDRESS=домен в .env → авто-HTTPS.
      # Нужен для рабочего пресейва: band.link-шлюз (Яндекс/VK/КИОН) принимает
      # redirectUrl только как публичный HTTPS-домен, иначе ERROR_1009.
      - SITE_ADDRESS=${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"                  # авто-HTTPS при SITE_ADDRESS=домен
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  dbdata:
  caddy_data:
  caddy_config:
