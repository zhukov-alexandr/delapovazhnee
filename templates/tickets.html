    <style>
      /* The tour, one concert per row, in date order — the poster's own list
         (date · city · venue) with each concert's poster beside it and its way
         in at the end of the line. Palette, type, nav and buttons come from
         /static/home/site.css (shared with the landing). */
      .tickets { padding: calc(var(--nav-h) + clamp(28px, 6vh, 64px)) 0 clamp(40px, 8vh, 88px); }
      .tickets__head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: clamp(26px, 4vw, 46px); }
      .tickets__title { font-size: clamp(52px, 10vw, 132px); }
      .tickets__sub { margin-top: 14px; font-size: clamp(15px, 1.8vw, 20px); line-height: 1.2; color: var(--pencil); }
      .tickets__mark { flex: 0 0 auto; width: clamp(96px, 15vw, 190px); height: auto; transform: rotate(-3deg); margin-bottom: 6px; }

      .gigs { list-style: none; }
      .gig {
        position: relative; display: grid; grid-template-columns: clamp(104px, 13vw, 150px) minmax(0, 1fr);
        column-gap: clamp(18px, 3.2vw, 44px); align-items: center; padding: clamp(24px, 3.2vw, 38px) 0;
      }
      /* every row is ruled off with a crossed-out pencil line */
      .gig::before { content: ""; position: absolute; left: -1.5%; right: -1.5%; top: -9px; height: 18px; pointer-events: none; background: var(--strike-1) center / 100% 100% no-repeat; opacity: 0.45; }
      .gig:nth-child(3n + 2)::before { background-image: var(--strike-2); }
      .gig:nth-child(3n)::before { background-image: var(--strike-3); }
      .gig__poster { display: block; width: 100%; height: auto; outline: 1px solid var(--rule); transform: rotate(-1.5deg); }
      .gig:nth-child(even) .gig__poster { transform: rotate(1.5deg); }
      .gig__lines { display: grid; gap: clamp(20px, 2.6vw, 30px); }
      .gig__line { display: grid; grid-template-columns: 9.5em minmax(0, 1fr) auto; column-gap: clamp(16px, 3vw, 40px); align-items: center; }
      .gig__when { font-size: clamp(18px, 2.1vw, 24px); line-height: 1.15; }
      .gig__when small { display: block; font-size: 0.8em; color: var(--pencil); }
      .gig__city { font-size: clamp(26px, 3.7vw, 48px); line-height: 0.95; overflow-wrap: anywhere; }
      .gig__venue { margin-top: 7px; font-size: clamp(14px, 1.5vw, 17px); line-height: 1.25; color: var(--pencil); }
      .gig__action { display: flex; flex-direction: column; align-items: flex-end; gap: 9px; }
      .gig__action .btn { min-width: 10em; }
      /* TicketsCloud (tcwidget.js) wires the click via data-tc-event and tries to
         restyle the button; !important keeps it the same button as the others. */
      .gig__tix { appearance: none; margin: 0 !important; width: auto !important; height: auto !important; min-height: 0 !important; max-height: none !important; font-family: "Roboto Condensed", sans-serif !important; font-style: italic !important; font-weight: 600 !important; text-transform: uppercase !important; letter-spacing: 0.05em !important; font-size: clamp(15px, 1.7vw, 17px) !important; line-height: 1.2 !important; color: var(--black) !important; text-shadow: none !important; background: var(--chalk) !important; border: 2px solid var(--chalk) !important; border-radius: 0 !important; padding: 15px 28px !important; box-shadow: none !important; }
      .gig__tix:hover { background: transparent !important; color: var(--chalk) !important; }

      .tickets__foot { position: relative; display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; padding-top: clamp(24px, 3.2vw, 38px); font-size: 14px; color: var(--pencil); }
      .tickets__foot::before { content: ""; position: absolute; left: -1.5%; right: -1.5%; top: -9px; height: 18px; pointer-events: none; background: var(--strike-2) center / 100% 100% no-repeat; opacity: 0.45; }
      .tickets__foot a { color: var(--chalk); text-decoration: none; font-size: 15px; border-bottom: 2px solid var(--chalk); padding-bottom: 3px; }

      @media (max-width: 760px) {
        .tickets__head { align-items: center; }

        .gig__when small { display: inline; margin-left: 0.6em; }
        .gig__action { flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: flex-start; gap: 8px 12px; margin-top: 8px; }

        .gig__tix { padding: 12px 20px !important; }

    <!-- UTM passthrough: campaign tags on this page's URL ride along into
         the TicketsCloud checkout, so a ticket sale is attributed to the ad that
         brought the visitor. Deliberately NOT wrapped in DOMContentLoaded — that
         fires after the widget script below has already run; a plain sync script
         here lands between the parsed buttons and the widget. The landing sends
         its tags here in the /tickets link and in sessionStorage (site.js). -->
    <script>
      (function () {
        // utm_source stays pinned to "site" in the markup — this page IS the source.
        var KEYS = ["utm_medium", "utm_campaign", "utm_content", "utm_term"];
        var STORE = "dp_utm";
        var params = new URLSearchParams(location.search);
        var utm = {};
        KEYS.forEach(function (k) {
          var v = params.get(k);
          if (v) utm[k] = v.slice(0, 200); // cap absurd values; setAttribute can't inject markup
        });
        try {
          if (Object.keys(utm).length) {
            sessionStorage.setItem(STORE, JSON.stringify(utm));
          } else {
            var saved = JSON.parse(sessionStorage.getItem(STORE) || "{}");
            if (saved && typeof saved === "object") utm = saved;
          }
        } catch (_) { /* private mode / storage off — tags from this URL still apply */ }
        // Nothing to pass: the source tag already hard-coded on each button stands.
        if (!Object.keys(utm).length) return;
        document.querySelectorAll("[data-tc-event]").forEach(function (btn) {
          KEYS.forEach(function (k) {
            if (utm[k]) btn.setAttribute("data-tc-" + k, utm[k]);
          });
        });
      })();
    </script>
