<!doctype html>
<html lang="ru"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Настройки игры — админка</title>
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body class="admin">
  <div class="admin-shell">
    {% include "_admin_nav.html" %}

    <main class="admin-main">
      <h1 class="page-title">Настройки игры</h1>

      {% if saved %}<div class="notice">Сохранено</div>{% endif %}

      <section class="card form-card">
        <form method="post" action="/admin/settings">
          <div class="field">
            <label for="points_per_line">N (очков на строчку)</label>
            <input type="number" id="points_per_line" name="points_per_line"
                   min="1" step="1" value="{{ cfg.points_per_line }}" required>
          </div>

          <div class="field">
            <label for="speed_mult">Скорость игры
              <span class="value-badge" id="speed_mult_val">{{ '%.2f'|format(cfg.speed_mult) }}</span>
            </label>
            <input type="range" id="speed_mult" name="speed_mult"
                   min="0.6" max="1.2" step="0.05" value="{{ cfg.speed_mult }}">
          </div>

          <div class="field">
            <label for="music_volume">Громкость музыки
              <span class="value-badge" id="music_volume_val">{{ (cfg.music_volume * 100)|round|int }}%</span>
            </label>
            <input type="range" id="music_volume" name="music_volume"
                   min="0" max="1" step="0.01" value="{{ cfg.music_volume }}">
          </div>

          <button type="submit" class="btn btn-primary">Сохранить</button>
        </form>
      </section>

      <section class="card danger-card">
        <h2 class="card-title">Таблица рекордов</h2>
        {% if reset %}<div class="notice">Рекорды обнулены</div>{% endif %}
        <p class="muted">Удаляет все сохранённые результаты из таблицы лидеров.</p>
        <form method="post" action="/admin/scores/reset"
              onsubmit="return confirm('Обнулить ВСЕ рекорды? Таблица лидеров будет очищена безвозвратно.');">
          <button type="submit" class="btn btn-danger">Обнулить все рекорды</button>
        </form>
      </section>
    </main>
  </div>

  <script>
    (function () {
      function bind(id, labelId, fmt) {
        var slider = document.getElementById(id);
        var label = document.getElementById(labelId);
        if (!slider || !label) return;
        label.textContent = fmt(slider.value);
        slider.addEventListener('input', function () { label.textContent = fmt(slider.value); });
      }
      bind('speed_mult', 'speed_mult_val', function (v) { return Number(v).toFixed(2); });
      bind('music_volume', 'music_volume_val', function (v) { return Math.round(Number(v) * 100) + '%'; });
    })();
  </script>
</body></html>
